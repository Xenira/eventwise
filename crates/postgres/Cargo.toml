[package]
name = "eventwise-postgres"
version = "0.1.0"
edition = "2024"
exclude = [".sqlx/"]

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
eventwise-core = { path = "../core" }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "uuid"] }
serde = { workspace = true }
serde_json = "1.0.151"
thiserror = { workspace = true }

[dev-dependencies]
sqlx = { version = "0.9.0", features = ["runtime-tokio"] }
